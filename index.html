<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budget Calculator | Register</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 flex items-center justify-center min-h-screen">

  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-md">

    <h1 class="text-3xl font-bold text-center text-stone-800 mb-2">
      Create Account
    </h1>

    <p class="text-center text-stone-500 mb-6">
      Register to manage your budget
    </p>

    <!-- Username -->
    <div class="mb-4">
      <label class="block text-sm font-medium mb-2">Username</label>
      <input
        id="username"
        type="text"
        placeholder="Enter your username"
        class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500"
      />
    </div>

    <!-- Email -->
    <div class="mb-4">
      <label class="block text-sm font-medium mb-2">Email</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500"
      />
    </div>

    <!-- Password -->
    <div class="mb-6">
      <label class="block text-sm font-medium mb-2">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Create a password"
        class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500"
      />
    </div>

    <!-- Register Button -->
    <button
      onclick="register()"
      class="w-full bg-amber-700 text-white py-2 rounded-lg hover:bg-amber-800 transition"
    >
      Register
    </button>

    <!-- Login Link -->
    <p class="text-center text-sm mt-5 text-stone-600">
      Already have an account?
      <a href="login.html" class="text-amber-700 font-semibold">
        Login
      </a>
    </p>

  </div>

  <script src="./script.js"></script>
</body>
</html>
