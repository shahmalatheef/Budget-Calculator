<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Transaction</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-stone-100">

  <!-- Navbar -->
  <nav class="bg-amber-700 text-white px-6 py-4 flex justify-between">
    <h1 class="text-2xl font-bold">Budget Calculator</h1>
    <a href="dashboard.html" class="bg-white text-amber-700 px-4 py-1 rounded-lg">
      Dashboard
    </a>
  </nav>

  <div class="max-w-lg mx-auto mt-10 bg-white p-8 rounded-xl shadow">

    <h2 class="text-2xl font-bold text-center mb-6">Add Transaction</h2>

    <!-- Title -->
    <div class="mb-4">
      <label class="block mb-2 font-medium">Title</label>
      <input id="title" type="text"
        placeholder="Salary / Food / Travel"
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-amber-500 outline-none">
    </div>

    <!-- Amount -->
    <div class="mb-4">
      <label class="block mb-2 font-medium">Amount</label>
      <input id="amount" type="number"
        placeholder="Enter amount"
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-amber-500 outline-none">
    </div>

    <!-- Type -->
    <div class="mb-6">
      <label class="block mb-2 font-medium">Transaction Type</label>

      <select id="type"
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-amber-500 outline-none">
        <option value="">Select</option>
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
    </div>

    <!-- Button -->
    <button onclick="addTransaction()"
      class="w-full bg-amber-700 text-white py-3 rounded-lg hover:bg-amber-800">
      Add Transaction
    </button>

  </div>

  <script src="./transaction.js"></script>

</body>
</html>
