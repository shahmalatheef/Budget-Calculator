<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-stone-100">

  <!-- Navbar -->
  <nav class="bg-amber-700 text-white px-6 py-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold">Budget Calculator</h1>

    <div class="flex items-center gap-4">
      <span id="welcome"></span>
      <button onclick="logout()"
        class="bg-white text-amber-700 px-4 py-1 rounded-lg font-semibold hover:bg-stone-100">
        Logout
      </button>
    </div>
  </nav>

  <!-- Dashboard -->
  <div class="max-w-6xl mx-auto p-6">

    <h2 class="text-3xl font-bold text-stone-800 mb-6">Dashboard</h2>

    <!-- Cards -->
    <div class="grid md:grid-cols-3 gap-6">

      <div class="bg-green-100 rounded-xl p-6 shadow">
        <h3 class="text-green-700 font-semibold">Total Income</h3>
        <p id="incomeBox" class="text-3xl font-bold mt-2">₹0</p>
      </div>

      <div class="bg-red-100 rounded-xl p-6 shadow">
        <h3 class="text-red-700 font-semibold">Total Expense</h3>
        <p id="expenseBox" class="text-3xl font-bold mt-2">₹0</p>
      </div>

      <div class="bg-blue-100 rounded-xl p-6 shadow">
        <h3 class="text-blue-700 font-semibold">Balance</h3>
        <p id="balanceBox" class="text-3xl font-bold mt-2">₹0</p>
      </div>

    </div>

    <!-- Buttons -->
    <div class="grid md:grid-cols-2 gap-4 mt-8">

      <a href="transaction.html"
        class="bg-green-600 text-white text-center py-3 rounded-lg hover:bg-green-700">
        + Add Income / Expense
      </a>

      <a href="history.html"
        class="bg-amber-700 text-white text-center py-3 rounded-lg hover:bg-amber-800">
        View Transaction History
      </a>

    </div>

  </div>

  <script src="./dashboard.js"></script>

</body>
</html>
