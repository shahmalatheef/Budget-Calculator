<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction History</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-stone-100">

  <!-- Navbar -->
  <nav class="bg-amber-700 text-white px-6 py-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold">Budget Calculator</h1>

    <a href="dashboard.html"
      class="bg-white text-amber-700 px-4 py-2 rounded-lg font-semibold">
      Dashboard
    </a>
  </nav>

  <!-- History -->
  <div class="max-w-6xl mx-auto p-6">

    <h2 class="text-3xl font-bold text-center text-stone-800 mb-8">
      Transaction History
    </h2>

    <div class="overflow-x-auto bg-white rounded-xl shadow">
      <table class="w-full text-center">
        <thead class="bg-stone-200">
          <tr>
            <th class="p-3">Title</th>
            <th class="p-3">Type</th>
            <th class="p-3">Amount</th>
            <th class="p-3">Date & Time</th>
            <th class="p-3">Action</th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>

      </table>
    </div>

  </div>

  <script src="history.js"></script>
</body>
</html>
